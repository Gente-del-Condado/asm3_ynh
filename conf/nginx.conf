#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
    # Service clients may put credentials in query strings; never log them.
    access_log off;
    # headers-more overrides the inherited command list. Preserve YunoHost's
    # baseline while keeping the nonce CSP returned by the MFA screen.
    more_set_headers "Content-Security-Policy: upgrade-insecure-requests; $upstream_http_content_security_policy";
    more_set_headers "X-Content-Type-Options: nosniff";
    more_set_headers "X-XSS-Protection: 1; mode=block";
    more_set_headers "X-Download-Options: noopen";
    more_set_headers "X-Permitted-Cross-Domain-Policies: none";
    more_set_headers "X-Frame-Options: SAMEORIGIN";
    more_set_headers "Permissions-Policy: interest-cohort=()";
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;
    proxy_set_header X-ASM3-Proxy-Secret "__PROXY_SECRET__";
    proxy_set_header YNH_USER $http_ynh_user;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}
