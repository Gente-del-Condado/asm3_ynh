# Managed by the YunoHost package. Application settings belong in ASM3's UI.
base_url = https://__DOMAIN____URL_PATH__
service_url = https://__DOMAIN____URL_PATH__/service
locale = __LANGUAGE__
timezone = 0
db_type = MYSQL
db_host = localhost
db_port = 3306
db_username = __DB_USER__
db_password = __DB_PWD__
db_name = __DB_NAME__
deployment_type = wsgi
session_secure_cookie = true
session_debug = false
log_location = stderr
log_debug = false
email_errors = true
admin_email = root@__DOMAIN__
memcached_server =
# Media and documents are included in the SQL backup, including upgrade backups.
dbfs_store = database
disk_cache = __DATA_DIR__/cache
rollup_js = false
large_files_chunked = true
smtp_server = { "sendmail": false, "host": "127.0.0.1", "port": 587, "username": "__APP__", "password": "__MAIL_PWD__", "usetls": true }
from_address = __APP__@__DOMAIN__
video_enabled = true
video_thumbnail_cmd = ffmpeg -v 0 -y -an -i %(input)s -ss 00:00:2.000 -vframes 1 %(output)s

ynh_sso = true
ynh_instance = __APP__
ynh_proxy_secret = __PROXY_SECRET__
ynh_oidc_config = __INSTALL_DIR__/oidc.json
