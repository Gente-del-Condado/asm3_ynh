name: Validate package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package syntax, metadata and helper contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-jsonschema
          python3 tools/check_package.py
          python3 -m unittest discover -s tests -v
      - name: Exercise ASM3 against MariaDB
        run: |
          sudo apt-get install -y mariadb-server python3-cheroot python3-pil python3-mysqldb python3-psycopg2 python3-lxml python3-requests python3-reportlab python3-openpyxl python3-qrcode python3-boto3 python3-stripe python3-kombu
          python3 tools/smoke_test.py
      - name: Build repository archive
        run: bash tools/build_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: asm3-ynh-package
          path: dist/*
