name: Full YunoHost package_check (prepared runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-check:
    # Runner desechable con Incus/LXD y las dependencias de package_check.
    # Mantén la ejecución manual para que los PR no se ejecuten en un runner privilegiado.
    runs-on: [self-hosted, linux, yunohost-package-check]
    steps:
      - uses: actions/checkout@v4
      - name: Run official complete lifecycle matrix
        run: bash tools/run_package_check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yunohost-package-check-results
          path: .package-check/results/
