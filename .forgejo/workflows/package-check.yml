name: Full YunoHost package_check
on:
  workflow_dispatch:
jobs:
  package-check:
    # Runner de host con esta etiqueta, Incus y las dependencias de package_check.
    runs-on: yunohost-package-check
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the official matrix
        run: bash tools/run_package_check.sh
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: yunohost-package-check-results
          path: .package-check/results/
