# Merge these entries into the existing connectors list; keep YunoHost's LDAP connector.
# Replace the domain, organization and tenant; inject secrets through the Dex service environment.
connectors:
  - type: google
    id: google
    name: Google
    config:
      clientID: $GOOGLE_CLIENT_ID
      clientSecret: $GOOGLE_CLIENT_SECRET
      redirectURI: https://identidad.example.org/dex/callback
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: https://identidad.example.org/dex/callback
      orgs:
        - name: REEMPLAZAR_ORGANIZACION
          teams:
            - REEMPLAZAR_EQUIPO
      useLoginAsID: false
  - type: microsoft
    id: microsoft
    name: Microsoft
    config:
      clientID: $MICROSOFT_CLIENT_ID
      clientSecret: $MICROSOFT_CLIENT_SECRET
      redirectURI: https://identidad.example.org/dex/callback
      tenant: REEMPLAZAR_TENANT_UUID
      scopes:
        - openid
        - profile
        - email
